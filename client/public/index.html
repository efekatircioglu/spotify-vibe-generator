<html lang="en">
<head>

    <title>Audio Analysis Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="text-center p-8">
        <h1 class="text-5xl font-extrabold mb-4 gradient-text">Audio Intelligence</h1>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">Uncover the DNA of your audio. Click below to launch the full analysis dashboard.</p>
        <div>
            <button onclick="openModal()" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-bold py-4 px-8 rounded-full transition duration-300 shadow-lg hover:shadow-2xl transform hover:scale-105">
                Launch Full Analysis
            </button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 hidden z-50">

            <div class="p-5 border-b border-gray-700 flex justify-between items-center">
                <h2 id="modal-title" class="text-2xl font-bold">Comprehensive Audio Analysis</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <div id="modal-content-area" class="p-6 overflow-y-auto modal-content"></div>
        </div>
    </div>
    
    <div id="focus-view" class="fixed inset-0 flex items-center justify-center p-4 z-[60] hidden opacity-0">
        <div id="focus-view-content" class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-11/12 h-5/6 transform scale-95">
             </div>
    </div>

    <div id="tooltip"></div>


    <script>
        // --- DATA EMBEDDED ---
        const analysisData = { "highlevel": { "danceability": { "all": { "danceable": 3.00000096379e-14, "not_danceable": 1 }, "probability": 1, "value": "not_danceable" }, "gender": { "all": { "female": 0.622126698494, "male": 0.377873301506 }, "probability": 0.622126698494, "value": "female" }, "genre_dortmund": { "all": { "alternative": 0.00173079362139, "blues": 0.000234076520428, "electronic": 0.997009396553, "folkcountry": 0.00024758829386, "funksoulrnb": 0.0000162131018442, "jazz": 0.000586069189012, "pop": 0.0000228353383136, "raphiphop": 0.0000030562973734, "rock": 0.000149954546941 }, "probability": 0.997009396553, "value": "electronic" }, "genre_electronic": { "all": { "ambient": 0.824788510799, "dnb": 0.00784057378769, "house": 0.0541309453547, "techno": 0.0252032130957, "trance": 0.0880367308855 }, "probability": 0.824788510799, "value": "ambient" }, "genre_rosamerica": { "all": { "cla": 0.0140439113602, "dan": 0.10852714628, "hip": 0.525074064732, "jaz": 0.0282021481544, "pop": 0.0521702617407, "rhy": 0.187966510653, "roc": 0.0553710013628, "spe": 0.028644932434 }, "probability": 0.525074064732, "value": "hip" }, "genre_tzanetakis": { "all": { "blu": 0.0617713928223, "cla": 0.0343018434942, "cou": 0.102904699743, "dis": 0.0514719486237, "hip": 0.154438391328, "jaz": 0.309046447277, "met": 0.0441263727844, "pop": 0.0772129744291, "reg": 0.0617708563805, "roc": 0.102955065668 }, "probability": 0.309046447277, "value": "jaz" }, "ismir04_rhythm": { "all": { "ChaChaCha": 0.219179928303, "Jive": 0.0708882287145, "Quickstep": 0.020754950121, "Rumba-American": 0.105449870229, "Rumba-International": 0.11717300117, "Rumba-Misc": 0.0277258716524, "Samba": 0.165485441685, "Tango": 0.152673691511, "VienneseWaltz": 0.103436812758, "Waltz": 0.0172321908176 }, "probability": 0.219179928303, "value": "ChaChaCha" }, "mood_acoustic": { "all": { "acoustic": 0.0955903604627, "not_acoustic": 0.904409646988 }, "probability": 0.904409646988, "value": "not_acoustic" }, "mood_a 17802934e-06, 6.98387475495e-06, 6.57667214909e-06, 5.32606554771e-06, 5.01424256072e-06, 5.03292994836e-06, 4.4893181439e-06, 3.98336078433e-06, 2.91368019134e-06, 2.21005939238e-06, 1.92141988009e-06, 1.18954244499e-06, 8.38432754335e-07, 7.96279721271e-07, 3.94662976078e-07, 2.21890374519e-07, 1.33085279685e-07, 8.38024618588e-08, 8.33020550317e-08, 8.95782363841e-08, 9.61663957355e-08, 6.83915786226e-08] } }, "metadata": { "tags": { "album": ["The College Dropout"], "artist": ["Kanye West"], "title": ["Spaceship (feat. GLC and Consequence)"] } }, "rhythm": { "beats_count": 495, "bpm": 89.1494750977, "danceability": 1.1902936697 }, "tonal": { "thpcp":[1,0.933691859245,0.853007555008,0.861245214939,0.696768939495,0.442062079906,0.328215628862,0.342406630516,0.364264190197,0.334256649017,0.315428078175,0.320913523436,0.35806581378,0.464995145798,0.67702382803,0.835417926311,0.691507339478,0.476561158895,0.66906017065,0.938908219337,0.719447851181,0.417508333921,0.339020460844,0.317737460136,0.357445418835,0.440023392439,0.498956441879,0.532432258129,0.542129814625,0.512428581715,0.510303676128,0.495319604874,0.425611287355,0.396347403526,0.467070758343,0.751069545746], "chords_histogram": [11.1, 6.47, 6.30, 0, 3.88, 1.76, 27.88, 4.24, 5.12, 7.06, 0, 3.30, 0.07, 4.82, 1.44, 5.80, 6.28, 0.37, 0.21, 0, 0, 0.25, 0, 3.56], "chords_key": "F", "chords_scale": "minor", "key_key": "G#", "key_scale": "minor", "key_strength": 0.560105204582 } };
        const tooltips = { danceability: "Classifies whether a track is suitable for dancing based on rhythmic patterns.", gender: "Identifies the gender of the primary vocalist.", genre_dortmund: "Classifies the track into one of nine broad genres based on the Dortmund model.", genre_electronic: "Classifies the track into sub-genres of electronic music.", genre_rosamerica: "Classifies the track based on the Rosamerica genre taxonomy.", genre_tzanetakis: "Classifies the track based on the Tzanetakis genre collection.", ismir04_rhythm: "Classifies the track's rhythm into ballroom dance styles.", mood_acoustic: "Detects the presence of acoustic instruments.", mood_aggressive: "Detects if the track has an aggressive or intense mood.", mood_electronic: "Detects the presence of electronic instruments and sounds.", mood_happy: "Detects if the track has a happy, cheerful mood.", mood_party: "Detects if the track is suitable for a party atmosphere.", mood_relaxed: "Detects if the track has a relaxed, calm mood.", mood_sad: "Detects if the track has a sad or melancholic mood.", moods_mirex: "Classifies the track's mood into one of five clusters from the MIREX challenge.", timbre: "Describes the textural quality of the sound (bright vs. dark).", tonal_atonal: "Distinguishes between music with a clear tonal center (tonal) and music without (atonal).", voice_instrumental: "Classifies whether the track is primarily vocal or instrumental.", average_loudness: "A measure of the perceived loudness of the track, normalized to a 0-1 range.", dynamic_complexity: "Complexity of loudness changes over time. Higher values mean more variation.", rhythm_danceability: "How suitable a track is for dancing, based on tempo, regularity, and beat strength.", bpm: "Beats Per Minute, the tempo of the music.", beats_count: "Total number of detected beats in the track.", key_strength: "The confidence level of the detected musical key.", spectral_centroid: "Indicates the 'center of mass' of the sound spectrum. Higher values mean 'brighter' sounds.", melbands: "Represents the energy in different frequency bands, modeled after human hearing.", chords_histogram: "Shows the relative presence of each of the 12 major and 12 minor chords.", key: "The estimated musical key of the track, consisting of a tonic (e.g., C, G#) and a scale (major or minor).", thpcp: "Tonal Harmonic Pitch Class Profile (THPCP) shows the strength of each of the 12 musical pitch classes, providing a detailed view of the track's harmonic content." };
        const interpretations = { danceability: { not_danceable: "The track's rhythm is more suited for listening than dancing, likely due to its complexity or lack of a strong, regular beat." }, gender: { female: "A female vocalist is identified as the primary voice in this track.", male: "A male vocalist is identified as the primary voice in this track." }, genre_dortmund: { electronic: "The track is predominantly electronic, characterized by synthesized sounds and programmed beats." }, genre_electronic: { ambient: "This piece falls into the ambient sub-genre, suggesting a focus on atmosphere and texture over rhythm." }, genre_rosamerica: { hip: "The song aligns with the Hip-Hop genre, likely featuring rhythmic speech and strong basslines." }, genre_tzanetakis: { jaz: "Elements of Jazz are prominent, possibly including improvisation, swing rhythms, or characteristic instrumentation." }, ismir04_rhythm: { ChaChaCha: "The rhythm has characteristics of a Cha-Cha-Cha, with a syncopated 4/4 time signature." }, mood_acoustic: { not_acoustic: "The sound is primarily driven by electronic or amplified instruments, not acoustic ones." }, mood_aggressive: { not_aggressive: "The track lacks harsh, driving elements, creating a non-aggressive and likely smoother listening experience." }, mood_electronic: { electronic: "The sonic palette is dominated by synthesizers, drum machines, or other electronic sources." }, mood_happy: { not_happy: "The musical cues suggest a mood that is not overtly happy, possibly neutral, sad, or tense." }, mood_party: { not_party: "This track is not optimized for a high-energy party setting; it may be more introspective or relaxed." }, mood_relaxed: { relaxed: "The song's tempo, instrumentation, and dynamics create a soothing and relaxed atmosphere." }, mood_sad: { sad: "The track conveys a sense of sadness or melancholy, likely through a slow tempo, minor key, and somber instrumentation." }, timbre: { dark: "The sound is characterized by lower-frequency content, giving the track a warm, deep, or mellow feel." }, tonal_atonal: { atonal: "The track avoids a traditional key center, creating a sense of tension or abstraction." }, voice_instrumental: { instrumental: "The piece is primarily instrumental, with human voice being absent or non-focal." }, default: "This classification contributes to the overall sonic profile of the track." };

        // --- MODAL & UI LOGIC ---
        const modal = document.getElementById('modal');
        const modalContainer = document.getElementById('modal-container');
        const modalContentArea = document.getElementById('modal-content-area');
        const focusView = document.getElementById('focus-view');
        const focusViewContent = document.getElementById('focus-view-content');
        let activeCharts = [];
        let activeFocusChart = null;

        function openModal() {
            activeCharts.forEach(chart => chart.destroy());
            activeCharts = [];
            renderFullAnalysis(analysisData);
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            closeFocusView();
        }

        // --- FOCUS VIEW LOGIC ---
        function showFocusContainer(content) {
            if (activeFocusChart) activeFocusChart.destroy();
            focusViewContent.innerHTML = content;
            
            modalContainer.classList.add('blurred');
            focusView.classList.remove('hidden');
            setTimeout(() => {
                focusView.classList.remove('opacity-0');
                focusViewContent.classList.remove('scale-95');
            }, 10);
        }

        function openClassifierFocusView(key) {
            const feature = analysisData.highlevel[key];
            const featureName = key.replace(/_/g, ' ');
            const valueName = feature.value.replace(/_/g, ' ');
            const interpretationText = (interpretations[key] && interpretations[key][feature.value]) || interpretations.default;
            const sortedData = Object.entries(feature.all).sort(([,a],[,b]) => b-a);

            const content = `
                <div class="p-6 h-full flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div><h3 class="text-2xl font-bold capitalize gradient-text">${featureName}</h3><p class="text-lg text-gray-300">Dominant: <span class="font-semibold text-white">${valueName}</span></p></div>
                        <button onclick="closeFocusView()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow">
                        <div class="h-full min-h-[20rem]"><canvas id="focus-chart"></canvas></div>
                        <div class="flex flex-col">
                            <h4 class="font-semibold text-gray-200 mb-2">Detailed Breakdown</h4>
                            <ul class="space-y-1 text-sm text-gray-400 flex-grow overflow-y-auto pr-2">${sortedData.map(([label, prob]) => `<li class="flex justify-between items-center"><span>${label.charAt(0).toUpperCase() + label.slice(1)}</span><span class="font-mono text-gray-300">${(prob * 100).toFixed(2)}%</span></li>`).join('')}</ul>
                            <h4 class="font-semibold text-gray-200 mt-4 mb-2">Definition</h4><p class="text-sm text-gray-500">${tooltips[key]}</p>
                            <h4 class="font-semibold text-gray-200 mt-4 mb-2">Interpretation</h4><p class="text-sm text-gray-400">${interpretationText}</p>
                        </div>
                    </div>
                </div>`;
            showFocusContainer(content);

            const focusCtx = document.getElementById('focus-chart').getContext('2d');
            activeFocusChart = new Chart(focusCtx, {
                type: 'bar', data: { labels: sortedData.map(item => item[0]), datasets: [{ label: 'Probability', data: sortedData.map(item => item[1]), backgroundColor: sortedData.map(item => item[0] === feature.value ? '#38bdf8' : 'rgba(99, 102, 241, 0.6)'), borderColor: sortedData.map(item => item[0] === feature.value ? '#0ea5e9' : 'rgba(99, 102, 241, 1)'), borderWidth: 1 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#FFFFFF' } }, x: { title: { display: true, text: 'Probability', color: '#FFFFFF' }, ticks: { color: '#FFFFFF' } } } }
            });
        }
        
        function openChartFocusView(type) {
             const content = `
                <div class="p-6 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="text-2xl font-bold capitalize gradient-text">${type === 'chords' ? 'Chords Histogram' : (type === 'tonality' ? 'Tonality Profile' : 'Mel Bands Energy')}</h3>
                            <p id="dominant-chord-text" class="text-sm text-gray-400"></p>
                        </div>
                        <button onclick="closeFocusView()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
                    </div>
                    <div class="flex-grow overflow-x-auto scrollable-chart"><div style="width:1200px; height: 100%;"><canvas id="focus-chart"></canvas></div></div>
                </div>`;
            showFocusContainer(content);
            
            const focusCtx = document.getElementById('focus-chart').getContext('2d');
            const chartOptions = { responsive: true, maintainAspectRatio: false, scales: { y: { title: { display: true, text: 'Strength / Energy', color: '#FFFFFF'}, ticks: { color: '#FFFFFF' }}, x: { title: { display: true, text: 'Band / Class', color: '#FFFFFF'}, ticks: { color: '#FFFFFF', minRotation: 0, maxRotation: 0 }} } };

            if (type === 'melbands') {
                activeFocusChart = new Chart(focusCtx, { type: 'line', data: { labels: analysisData.lowlevel.melbands.mean.map((_, i) => `Band ${i + 1}`), datasets: [{ label: 'Mean Energy', data: analysisData.lowlevel.melbands.mean, borderColor: 'rgba(34, 211, 238, 1)', backgroundColor: 'rgba(34, 211, 238, 0.2)', fill: true, tension: 0.4 }] }, options: { ...chartOptions, plugins: { legend: { display: false } } } });
            } else if (type === 'chords') {
                const chordLabels = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const majorChords = analysisData.tonal.chords_histogram.slice(0, 12);
                const minorChords = analysisData.tonal.chords_histogram.slice(12);
                const dominantMajorIndex = majorChords.indexOf(Math.max(...majorChords));
                const dominantMinorIndex = minorChords.indexOf(Math.max(...minorChords));
                document.getElementById('dominant-chord-text').innerText = `Dominant Chords: ${chordLabels[dominantMajorIndex]} (Major), ${chordLabels[dominantMinorIndex]}m (Minor)`;
                activeFocusChart = new Chart(focusCtx, { type: 'line', data: { labels: chordLabels, datasets: [ { label: 'Major Chords', data: majorChords, borderColor: 'rgba(59, 130, 246, 1)', backgroundColor: 'rgba(59, 130, 246, 0.2)', fill: true, tension: 0.3, pointRadius: (ctx) => ctx.dataIndex === dominantMajorIndex ? 6 : 3, pointBackgroundColor: (ctx) => ctx.dataIndex === dominantMajorIndex ? '#38bdf8' : 'rgba(59, 130, 246, 1)' }, { label: 'Minor Chords', data: minorChords, borderColor: 'rgba(234, 179, 8, 1)', backgroundColor: 'rgba(234, 179, 8, 0.2)', fill: true, tension: 0.3, pointRadius: (ctx) => ctx.dataIndex === dominantMinorIndex ? 6 : 3, pointBackgroundColor: (ctx) => ctx.dataIndex === dominantMinorIndex ? '#facc15' : 'rgba(234, 179, 8, 1)' } ] }, options: { ...chartOptions, plugins: { legend: { labels: { color: '#d1d5db' } } } } });
            } else if (type === 'tonality') {
                 const thpcpLabels = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                 activeFocusChart = new Chart(focusCtx, { type: 'line', data: { labels: thpcpLabels, datasets: [{ label: 'Pitch Strength', data: analysisData.tonal.thpcp.slice(0,12), borderColor: 'rgba(22, 163, 74, 1)', backgroundColor: 'rgba(22, 163, 74, 0.2)', fill: true, tension: 0.4 }] }, options: { ...chartOptions, plugins: { legend: { display: false } }, scales: { ...chartOptions.scales, x: { ...chartOptions.scales.x, title: { display: true, text: 'Pitch Class', color: '#FFFFFF'} } } } });
            }
        }

        function openMetricFocusView(key) {
            let value, title, interpretation;
            const definition = tooltips[key.replace(/_/g, ' ')];
            switch(key) {
                case 'bpm': value = analysisData.rhythm.bpm.toFixed(1); title = 'BPM (Beats Per Minute)'; interpretation = `A tempo of ${value} BPM is moderately paced, common in genres like hip-hop and pop. It provides a steady foundation without being overly energetic or slow.`; break;
                case 'danceability': value = analysisData.rhythm.danceability.toFixed(2); title = 'Danceability'; interpretation = `With a score of ${value}, this track's rhythmic consistency, tempo stability, and beat strength are analyzed. Higher scores (closer to 2.0) suggest the track is highly suitable for dancing.`; break;
                case 'loudness': value = `${(analysisData.lowlevel.average_loudness * 100).toFixed(1)}%`; title = 'Average Loudness'; interpretation = `This value represents the overall perceived volume. A score of ${value} suggests a relatively high and consistent volume level, common in commercially produced music.`; break;
                case 'dyn_complexity': value = analysisData.lowlevel.dynamic_complexity.toFixed(2); title = 'Dynamic Complexity'; interpretation = `This score of ${value} reflects the variation in loudness throughout the track. Higher values indicate significant changes between quiet and loud sections, contributing to a more expressive and less uniform sound.`; break;
            }
            const content = `<div class="p-8 text-center h-full flex flex-col justify-center"><div class="absolute top-6 right-6"><button onclick="closeFocusView()" class="text-gray-400 hover:text-white text-3xl">&times;</button></div><h3 class="text-2xl font-bold text-gray-300 mb-2">${title}</h3><p class="text-7xl font-extrabold gradient-text my-6">${value}</p><h4 class="font-semibold text-gray-200 mt-4 mb-2">Interpretation</h4><p class="text-gray-400 max-w-md mx-auto">${interpretation}</p><h4 class="font-semibold text-gray-200 mt-4 mb-2">Definition</h4><p class="text-sm text-gray-500 max-w-md mx-auto">${definition}</p></div>`;
            showFocusContainer(content);
        }

        function closeFocusView() {
            if (focusView.classList.contains('hidden')) return;
            if (activeFocusChart) { activeFocusChart.destroy(); activeFocusChart = null; }
            modalContainer.classList.remove('blurred');
            focusView.classList.add('opacity-0');
            focusViewContent.classList.add('scale-95');
            setTimeout(() => { focusView.classList.add('hidden'); focusViewContent.innerHTML = ''; }, 500);
        }

        // --- MAIN RENDER FUNCTION ---
        function renderFullAnalysis(data) {
            const meta = data.metadata.tags;
            const high = data.highlevel;
            modalContentArea.innerHTML = `<div class="bg-gray-900/50 p-6 rounded-xl mb-8 text-center border border-gray-700"><h3 class="text-3xl font-bold gradient-text">${meta.title[0]}</h3><p class="text-xl text-gray-300">${meta.artist[0]} &mdash; ${meta.album[0]}</p></div><div class="mb-8"><h3 class="text-2xl font-bold mb-4 text-gray-100">High-Level Classifiers</h3><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="high-level-grid"></div></div><div class="mb-8"><h3 class="text-2xl font-bold mb-4 text-gray-100">Key Metrics</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="key-metrics-grid"></div></div><div><h3 class="text-2xl font-bold mb-4 text-gray-100">Detailed Analysis</h3><div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="detailed-analysis-grid"></div></div>`;
            const highLevelGrid = document.getElementById('high-level-grid');
            for (const key in high) { highLevelGrid.appendChild(createHighLevelCard(key, high[key])); }
            document.getElementById('key-metrics-grid').innerHTML = `${createMetricCard('BPM', data.rhythm.bpm.toFixed(1), 'Beats Per Minute', tooltips.bpm, 'bpm')}${createMetricCard('Danceability', data.rhythm.danceability.toFixed(2), 'Rhythm-based score', tooltips.rhythm_danceability, 'danceability')}${createMetricCard('Loudness', `${(data.lowlevel.average_loudness*100).toFixed(1)}%`, 'Average perceived volume', tooltips.average_loudness, 'loudness')}${createMetricCard('Dyn. Complexity', data.lowlevel.dynamic_complexity.toFixed(2), 'Loudness variation', tooltips.dynamic_complexity, 'dyn_complexity')}`;
            document.getElementById('detailed-analysis-grid').innerHTML = `<div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700 card-hover" onclick="openChartFocusView('tonality')"><h4 class="text-lg font-semibold mb-2 text-gray-200" data-tooltip="${tooltips.thpcp}">Tonality Profile</h4><div class="chart-container"><canvas id="tonality-chart"></canvas></div></div><div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700 card-hover" onclick="openChartFocusView('melbands')"><h4 class="text-lg font-semibold mb-2 text-gray-200" data-tooltip="${tooltips.melbands}">Mel Bands Mean Energy</h4><div class="chart-container"><canvas id="melbands-chart"></canvas></div></div><div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700 card-hover" onclick="openChartFocusView('chords')"><h4 class="text-lg font-semibold mb-2 text-gray-200" data-tooltip="${tooltips.chords_histogram}">Chords Histogram</h4><div class="chart-container"><canvas id="chords-chart"></canvas></div></div>`;
            renderDashboardCharts(data);
            setupTooltips();
        }

        function createHighLevelCard(key, feature) {
            const card = document.createElement('div');
            card.className = 'bg-gray-900/50 p-4 rounded-xl flex flex-col border border-gray-700 card-hover';
            card.setAttribute('onclick', `openClassifierFocusView('${key}')`);
            const probabilityPercent = (feature.probability * 100).toFixed(1);
            const featureName = key.replace(/_/g, ' ');
            const valueName = feature.value.replace(/_/g, ' ');
            const interpretationText = (interpretations[key] && interpretations[key][feature.value]) || interpretations.default;
            card.innerHTML = `<h4 class="text-md font-semibold capitalize text-gray-300 mb-2" data-tooltip="${tooltips[key] || ''}">${featureName}</h4><div class="text-center my-2"><p class="text-2xl font-bold gradient-text">${valueName}</p><p class="text-sm text-gray-400">Confidence: ${probabilityPercent}%</p></div><div class="chart-container h-24 mt-auto mb-3"><canvas id="chart-${key}"></canvas></div><div class="mt-2 pt-3 border-t border-gray-700"><p class="text-xs text-gray-400"><span class="font-semibold text-gray-200">Impact:</span> ${interpretationText.substring(0, 70) + (interpretationText.length > 70 ? '...' : '')}</p></div>`;
            setTimeout(() => {
                const ctx = document.getElementById(`chart-${key}`).getContext('2d');
                if (Object.keys(feature.all).length === 2) {
                    activeCharts.push(new Chart(ctx, { type: 'doughnut', data: { labels: [valueName, 'Other'], datasets: [{ data: [feature.probability, 1 - feature.probability], backgroundColor: ['#22d3ee', '#374151'], borderColor: '#1f2937', borderWidth: 4, cutout: '70%' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } } } }));
                } else {
                    const sortedData = Object.entries(feature.all).sort(([,a],[,b]) => b-a).slice(0, 5);
                    activeCharts.push(new Chart(ctx, { type: 'bar', data: { labels: sortedData.map(item => item[0]), datasets: [{ label: 'Probability', data: sortedData.map(item => item[1]), backgroundColor: 'rgba(99, 102, 241, 0.6)', borderColor: 'rgba(99, 102, 241, 1)', borderWidth: 1 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: {  y: { ticks: { color: '#9CA3AF', font: { size: 10 } } }, x: { display: false } } } }));
                }
            }, 0);
            return card;
        }

        function createMetricCard(title, value, description, tooltipText, key) { return `<div class="bg-gray-900/50 p-4 rounded-xl text-center border border-gray-700 card-hover" data-tooltip="${tooltipText}" onclick="openMetricFocusView('${key}')"><h4 class="text-sm font-medium text-gray-400">${title}</h4><p class="text-4xl font-bold text-gray-100 my-2">${value}</p><p class="text-xs text-gray-500">${description}</p></div>`; }
        
        function renderDashboardCharts(data) {
            const tonal = data.tonal;
            // Tonality Chart
            const tonalityCtx = document.getElementById('tonality-chart').getContext('2d');
            activeCharts.push(new Chart(tonalityCtx, { type: 'line', data: { labels: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], datasets: [{ label: 'Pitch Strength', data: tonal.thpcp.slice(0,12), borderColor: 'rgba(22, 163, 74, 1)', backgroundColor: 'rgba(22, 163, 74, 0.2)', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#9CA3AF' }} } } }));
            // Mel Bands Chart
            const melCtx = document.getElementById('melbands-chart').getContext('2d');
            activeCharts.push(new Chart(melCtx, { type: 'line', data: { labels: data.lowlevel.melbands.mean.map((_, i) => `B${i + 1}`), datasets: [{ label: 'Mean Energy', data: data.lowlevel.melbands.mean, borderColor: 'rgba(34, 211, 238, 1)', backgroundColor: 'rgba(34, 211, 238, 0.2)', fill: true, tension: 0.4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#9CA3AF', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }} } } }));
            // Chords Chart
            const chordsCtx = document.getElementById('chords-chart').getContext('2d');
            activeCharts.push(new Chart(chordsCtx, { type: 'line', data: { labels: ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'], datasets: [ { label: 'Major Chords', data: tonal.chords_histogram.slice(0, 12), borderColor: 'rgba(59, 130, 246, 1)', backgroundColor: 'rgba(59, 130, 246, 0.2)', fill: true, tension: 0.3 }, { label: 'Minor Chords', data: tonal.chords_histogram.slice(12), borderColor: 'rgba(234, 179, 8, 1)', backgroundColor: 'rgba(234, 179, 8, 0.2)', fill: true, tension: 0.3 } ] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { display: false }, x: { ticks: { color: '#9CA3AF' }} }, plugins: { legend: { labels: { color: '#d1d5db' }, position: 'bottom' } } } }));
        }

        function setupTooltips() {
            const tooltipEl = document.getElementById('tooltip');
            document.querySelectorAll('[data-tooltip]').forEach(el => {
                el.addEventListener('mousemove', e => { if (el.dataset.tooltip) { tooltipEl.style.display = 'block'; tooltipEl.textContent = el.dataset.tooltip; tooltipEl.style.left = `${e.pageX + 15}px`; tooltipEl.style.top = `${e.pageY + 15}px`; } });
                el.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });
            });
        }
    </script>
</body>
</html>
